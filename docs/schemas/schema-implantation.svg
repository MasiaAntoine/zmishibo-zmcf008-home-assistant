<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" width="640" height="780">
  <rect width="640" height="780" fill="#f7f4ee"/>
  <text x="28" y="36" font-family="Georgia, serif" font-size="20" fill="#1c1915">Implantation — tête de carte</text>
  <text x="28" y="56" font-family="system-ui, sans-serif" font-size="12" fill="#5c564c">Même sens que la photo : antenne en haut de la télécommande.</text>

  <!-- board -->
  <rect x="70" y="80" width="500" height="660" rx="18" fill="#1f7a4d" stroke="#145c38" stroke-width="3"/>

  <!-- antenna -->
  <path d="M250 100 h16 v22 h14 v-22 h14 v22 h14 v-22 h14 v22 h14 v-22 h14 v22 h16" fill="none" stroke="#e8a87c" stroke-width="3"/>
  <text x="250" y="146" font-family="system-ui, sans-serif" font-size="12" fill="#ecfccb">ANT méandre</text>

  <!-- 222 -->
  <rect x="300" y="168" width="36" height="16" rx="2" fill="#111" stroke="#e7e5e4"/>
  <text x="344" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#fff">R1 222 = 2,2 kΩ</text>

  <!-- crystal -->
  <rect x="400" y="210" width="52" height="42" rx="3" fill="#f5e6c8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="408" y="228" font-family="ui-monospace, monospace" font-size="9" fill="#1c1915">16.000</text>
  <text x="414" y="242" font-family="ui-monospace, monospace" font-size="9" fill="#1c1915">MHz</text>
  <text x="460" y="228" font-family="system-ui, sans-serif" font-size="12" fill="#fff">Y1</text>
  <text x="460" y="244" font-family="system-ui, sans-serif" font-size="11" fill="#ecfccb">cercle blanc</text>

  <!-- blue cap -->
  <rect x="330" y="250" width="14" height="28" rx="2" fill="#d6d3d1" stroke="#1c1915"/>
  <text x="350" y="268" font-family="system-ui, sans-serif" font-size="12" fill="#fff">C? non marqué</text>
  <text x="350" y="284" font-family="system-ui, sans-serif" font-size="11" fill="#ecfccb">cercle bleu</text>

  <!-- second passive -->
  <rect x="468" y="262" width="22" height="12" rx="1" fill="#d6c4a8" stroke="#1c1915"/>
  <text x="494" y="272" font-family="system-ui, sans-serif" font-size="11" fill="#fff">C? second CMS</text>

  <!-- IC -->
  <rect x="250" y="230" width="70" height="150" rx="3" fill="#0c0a09" stroke="#a8a29e"/>
  <circle cx="305" cy="362" r="4" fill="#e7e5e4"/>
  <text x="262" y="310" font-family="system-ui, sans-serif" font-size="12" fill="#fafaf9">U1</text>
  <text x="200" y="400" font-family="system-ui, sans-serif" font-size="11" fill="#ecfccb">pin 1</text>

  <!-- pins left -->
  <g fill="#d6d3d1">
    <rect x="236" y="242" width="14" height="6"/>
    <rect x="236" y="256" width="14" height="6"/>
    <rect x="236" y="270" width="14" height="6"/>
    <rect x="236" y="284" width="14" height="6"/>
    <rect x="236" y="298" width="14" height="6"/>
    <rect x="236" y="312" width="14" height="6"/>
    <rect x="236" y="326" width="14" height="6"/>
    <rect x="236" y="340" width="14" height="6"/>
    <rect x="320" y="242" width="14" height="6"/>
    <rect x="320" y="256" width="14" height="6"/>
    <rect x="320" y="270" width="14" height="6"/>
    <rect x="320" y="284" width="14" height="6"/>
    <rect x="320" y="298" width="14" height="6"/>
    <rect x="320" y="312" width="14" height="6"/>
    <rect x="320" y="326" width="14" height="6"/>
    <rect x="320" y="340" width="14" height="6"/>
  </g>

  <!-- domes -->
  <circle cx="150" cy="250" r="28" fill="#c0c6ce" stroke="#6b7280" stroke-width="3"/>
  <circle cx="490" cy="250" r="28" fill="#c0c6ce" stroke="#6b7280" stroke-width="3"/>
  <text x="118" y="300" font-family="system-ui, sans-serif" font-size="11" fill="#ecfccb">ON/OFF</text>
  <text x="468" y="300" font-family="system-ui, sans-serif" font-size="11" fill="#ecfccb">ALL OFF</text>

  <circle cx="150" cy="360" r="24" fill="#c0c6ce" stroke="#6b7280" stroke-width="3"/>
  <circle cx="490" cy="360" r="24" fill="#c0c6ce" stroke="#6b7280" stroke-width="3"/>
  <text x="136" y="402" font-family="system-ui, sans-serif" font-size="11" fill="#ecfccb">F ?</text>
  <text x="478" y="402" font-family="system-ui, sans-serif" font-size="11" fill="#ecfccb">R ?</text>

  <text x="90" y="470" font-family="system-ui, sans-serif" font-size="13" fill="#ecfccb">Le reste de la carte est la matrice des vitesses 1–6,</text>
  <text x="90" y="490" font-family="system-ui, sans-serif" font-size="13" fill="#ecfccb">de la lumière et des minuteries. Voir le schéma clavier.</text>

  <text x="90" y="700" font-family="system-ui, sans-serif" font-size="12" fill="#d9f99d">Sérigraphie bas de carte : 5783 et JK-1 (lecture photo).</text>
</svg>
