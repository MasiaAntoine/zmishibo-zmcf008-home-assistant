esphome:
  name: esphome-web-68e5c8
  friendly_name: relais-ventilateur
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32c3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: y
  flash_size: 4MB

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  custom_services: true
  homeassistant_services: true

ota:
  - platform: esphome

# Copier secrets.yaml.example en secrets.yaml. Le C3 ne voit que le 2,4 GHz.
# Les secrets sont compilés : les changer impose un flash USB.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://NicoIIT/esphome-ble_adv_proxy

ble_adv_proxy:
  use_max_tx_power: true

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms

light:
  - platform: status_led
    name: Voyant
    pin:
      number: GPIO8
      inverted: true
